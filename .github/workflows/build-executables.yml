name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ObservationWorkbench-windows-x64
            artifact_path: dist/ObservationWorkbench
          - os: macos-15-intel
            asset_name: ObservationWorkbench-macos-x64
            artifact_path: dist/ObservationWorkbench.app
          - os: macos-14
            asset_name: ObservationWorkbench-macos-arm64
            artifact_path: dist/ObservationWorkbench.app
          - os: ubuntu-latest
            asset_name: ObservationWorkbench-linux-x64
            artifact_path: dist/ObservationWorkbench

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/observation_workbench.spec --noconfirm --clean

      # Windows and Linux ship an onedir folder (exe/binary + libs as loose
      # files) — zip its *contents* at the archive root so extracting the
      # release zip doesn't add an extra ObservationWorkbench/ folder on top
      # of the one Explorer/most extractors already create from the zip name.
      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "${{ matrix.artifact_path }}\*" -DestinationPath "${{ matrix.asset_name }}.zip"
        shell: pwsh

      - name: Zip artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "${{ matrix.artifact_path }}"
          zip -r "${GITHUB_WORKSPACE}/${{ matrix.asset_name }}.zip" .

      # macOS is the opposite: the .app bundle itself must stay intact as a
      # single folder for Finder/Launch Services to treat it as one app.
      - name: Zip artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd "$(dirname "${{ matrix.artifact_path }}")"
          zip -r "${GITHUB_WORKSPACE}/${{ matrix.asset_name }}.zip" "$(basename "${{ matrix.artifact_path }}")"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

  release:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
