[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observation-workbench"
version = "1.0.0"
description = "Observation Workbench — learn from expert iNaturalist identifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alan Rockefeller" }]
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
observation-workbench = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["observation_workbench*"]
